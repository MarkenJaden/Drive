version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_COMMA_URL_ROOT: "/"
        VITE_ATHENA_URL_ROOT: "/athena/"
        VITE_BILLING_URL_ROOT: "/v1/prime/"
        VITE_USERADMIN_URL_ROOT: "/v1/me/"
    environment:
      - SERVICE_FQDN_DRIVE
    labels:
      - "coolify.managed=true"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - JWT_SECRET=${SERVICE_PASSWORD_JWT:-$SERVICE_PASSWORD_64}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN:-$SERVICE_PASSWORD}
      - REQUIRE_2FA=${REQUIRE_2FA:-true}
      - APP_URL=https://${SERVICE_FQDN_WEB:-drive.markenjaden.de}
    volumes:
      - drive_data:/app/data
    restart: unless-stopped

volumes:
  drive_data:
    name: drive_data
