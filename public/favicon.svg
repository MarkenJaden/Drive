<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="driveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="driveAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#driveBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Modern Sleek Sports / Hybrid Car Silhouette -->
  <!-- Roof and Windshield -->
  <path d="M 38 52 C 45 40, 55 36, 68 36 C 81 36, 89 42, 94 52 Z" fill="#22c55e" opacity="0.25"/>
  <path d="M 39 52 C 46 41, 56 38, 68 38 C 79 38, 87 43, 93 52 Z" fill="none" stroke="url(#driveAccent)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Car Body Main Line -->
  <path d="M 20 66 C 24 58, 33 54, 42 54 L 88 54 C 97 54, 105 59, 109 66 C 111 70, 110 76, 105 78 L 24 78 C 19 78, 17 72, 20 66 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Headlights & Taillights / Energy Glow -->
  <circle cx="28" cy="68" r="3.5" fill="#38bdf8"/>
  <circle cx="101" cy="68" r="3.5" fill="#f87171"/>
  
  <!-- Wheels -->
  <circle cx="38" cy="80" r="10" fill="#18181b" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="38" cy="80" r="4" fill="url(#driveAccent)"/>
  
  <circle cx="90" cy="80" r="10" fill="#18181b" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="90" cy="80" r="4" fill="url(#driveAccent)"/>

  <!-- Dynamic Road / Speed Arc -->
  <path d="M 18 96 C 45 102, 83 102, 110 96" fill="none" stroke="url(#driveAccent)" stroke-width="3.5" stroke-linecap="round"/>
</svg>